<style>
:root{
  --bg:#e9f2fb; --card:#fff; --line:#c2d8ee; --soft:#dceaf7;
  --ink:#13253e; --dim:#55708f; --faint:#7c93b1; --blue:#2f7fd6; --deep:#1b4f8c;
  --red:#b03a2e;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:rgba(47,127,214,.15);}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-bottom:40px;
}
.wrap{max-width:860px;margin:0 auto;padding:0 16px;}

header{
  background:#fff;border-bottom:2px solid var(--blue);
  padding:14px 16px;margin-bottom:22px;
  display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;
}
#brandBadge{height:64px;width:auto;display:block;}
#brandWord{width:min(300px,62vw);height:auto;display:block;}

h2{
  font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim);margin:0 0 10px;
}

.card{
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:16px;margin-bottom:18px;
}

.grid{display:flex;flex-wrap:wrap;gap:14px;}
.f{flex:1 1 190px;}
.f label{
  display:block;font-size:10.5px;font-weight:800;letter-spacing:.1em;
  text-transform:uppercase;color:var(--faint);margin-bottom:5px;
}
.f input{
  width:100%;padding:11px 12px;border:1px solid #a9c6e3;border-radius:8px;
  background:#f7fbff;color:var(--ink);font-family:inherit;font-size:15.5px;font-weight:600;
}
.f input::placeholder{color:#9db4cc;font-weight:400;}
.f input:focus{outline:2px solid var(--blue);outline-offset:1px;border-color:var(--blue);}
.f select{
  width:100%;padding:11px 12px;border:1px solid #a9c6e3;border-radius:8px;
  background:#f7fbff;color:var(--ink);font-family:inherit;font-size:15px;font-weight:600;
}
.f select:focus{outline:2px solid var(--blue);outline-offset:1px;border-color:var(--blue);}
.f input.num{font-family:'JetBrains Mono',monospace;text-align:right;}

/* ---- items ---- */
.item{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:13px 0;border-bottom:1px solid var(--soft);
}
.item:last-child{border-bottom:none;}
.item .nm{flex:1 1 180px;min-width:0;}
.item .nm b{display:block;font-size:16px;font-weight:700;line-height:1.25;}
.item .nm span{display:block;font-size:11.5px;color:var(--faint);margin-top:2px;}
.qtybox{display:flex;align-items:center;gap:7px;}
.qtybox input{
  width:82px;padding:10px;border:1px solid #a9c6e3;border-radius:8px;
  background:#f7fbff;color:var(--ink);text-align:right;
  font-family:'JetBrains Mono',monospace;font-size:15.5px;font-weight:600;
}
.qtybox input:focus{outline:2px solid var(--blue);outline-offset:1px;border-color:var(--blue);}
.qtybox .u{font-size:11.5px;color:var(--faint);font-weight:700;width:26px;}
.amt{
  flex:0 0 108px;text-align:right;
  font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:700;
  font-variant-numeric:tabular-nums;
}
.amt.off{color:#a9bed4;font-weight:500;}
.amt.warn{color:var(--red);font-size:13px;font-weight:700;}
details.sec{border-top:1px solid var(--soft);}
details.sec:first-child{border-top:none;}
details.sec > summary{
  list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;
  padding:13px 0;font-size:14px;font-weight:800;color:var(--ink);
}
details.sec > summary::-webkit-details-marker{display:none;}
details.sec > summary::before{
  content:"";width:7px;height:7px;flex:none;border-right:2px solid var(--blue);
  border-bottom:2px solid var(--blue);transform:rotate(-45deg);transition:transform .15s;
}
details.sec[open] > summary::before{transform:rotate(45deg);}
details.sec > summary span{flex:1;}
details.sec > summary .cnt{font-style:normal;font-size:11.5px;font-weight:700;color:var(--blue);}
details.sec .item:last-child{border-bottom:none;}
.ratebox input{width:74px;}
.nm .nd{font-style:normal;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  color:#9a5b00;background:#fff3dc;border:1px solid #f1d39b;border-radius:5px;padding:1px 5px;
  vertical-align:2px;white-space:nowrap;}
.modesw{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none;}
.modesw button{
  border:none;background:#fff;color:var(--dim);font-family:inherit;font-size:12px;font-weight:700;
  padding:7px 10px;cursor:pointer;
}
.modesw button + button{border-left:1px solid var(--line);}
.item.mode-extra .modesw button[data-mode="extra"],
.item.mode-incl  .modesw button[data-mode="incl"]{background:var(--blue);color:#fff;}
.item.mode-incl .ratebox{display:none;}
.amt.incl{color:#2e7d4f;font-size:13.5px;}
.cardhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;}
.cardhead h2{margin:0;}
.wtbtn{
  border:1px solid var(--line);background:#fff;color:var(--dim);border-radius:8px;
  padding:7px 12px;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;
}
.wtbtn[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff;}
.amt .wt{display:none;font-size:11.5px;font-weight:600;color:var(--faint);margin-top:2px;}
body.showwt .amt .wt{display:block;}
.tot .r.wtrow{display:none;}
body.showwt .tot .r.wtrow{display:flex;}
.grouplbl{
  font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
  color:var(--blue);padding:14px 0 4px;border-bottom:1px solid var(--soft);
}
.grouplbl:first-child{padding-top:0;}

/* ---- totals ---- */
.tot{margin-top:4px;}
.tot .r{
  display:flex;justify-content:space-between;gap:16px;
  padding:9px 0;border-bottom:1px solid var(--soft);font-size:15px;
}
.tot .r span:first-child{color:var(--dim);font-weight:600;}
.tot .r span:last-child{font-family:'JetBrains Mono',monospace;font-weight:700;}
.tot .r.ded span{color:var(--red);}
.tot .r.grand{
  margin-top:10px;background:var(--deep);color:#fff;border:none;border-radius:9px;
  padding:14px 16px;font-size:18px;
}
.tot .r.grand span:first-child{color:#fff;font-weight:800;}
.tot .r.grand span:last-child{color:#fff;font-size:20px;font-weight:800;}

.btn{
  display:block;width:100%;padding:15px;border:none;border-radius:10px;
  background:var(--blue);color:#fff;font-family:inherit;
  font-size:16px;font-weight:800;letter-spacing:.02em;cursor:pointer;margin-top:16px;
}
.btn:active{background:var(--deep);}
.btn.ghost{
  background:#fff;color:var(--dim);border:1px solid var(--line);
  font-size:14px;font-weight:700;padding:12px;margin-top:9px;
}
footer{text-align:center;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8aa2bd;margin-top:26px;}
</style>

 {key:"3030",  label:"300 × 300",  role:"Truss",
  pipe:"Main Ø50 × 2 · Diag Ø25 × 2 · End frame Ø50 × 2 · Cross Ø25 × 2",
  w:{1:8.74, 2:12.75, 3:17.81}},   /* approved drawings VST_300_300_1/2/3_50, 16/10/26; chords 250 c/c */

 {key:"6052",  label:"600 × 525",  role:"Beam",   pipe:"Main Ø50.00 × 3 · Diag Ø30.00 × 3 · Horiz Ø40.00 × 3",

  w:{1:15.01, 2:23.07, 3:39.24}},   /* box truss design drawing: 525 × 600, chords 475 × 550 c/c */
 /* ---- from "Vardaman Truss Profiles – Pipe & Member Brief" (approved = drawing weights;
        nd = new design, weights calculated, confirm in CAD before production) ---- */
 {key:"4040H", label:"400 × 400 Heavy", role:"Truss", nd:true,
  pipe:"Main Ø50 × 4 · Diag Ø25 × 3 · End frame Ø50 × 3 · Cross Ø25 × 3",
  w:{1:13.49, 2:22.40, 3:35.72}},   /* light + Ø50×4 chords; doc estimate 35.7 kg / 3 m */
 {key:"4141",  label:"410 × 410 (Ø60 × 4)", role:"Pillar", nd:true,
  pipe:"Main Ø60 × 4 · Diag Ø30 × 3 · End frame Ø40 × 3",
  w:{1:15.88, 2:26.62, 3:37.86}},   /* 490 × 490 design at 350 c/c; weights calculated from its
                                        member table, calibrated to the doc's 490 weights */
 {key:"4848",  label:"480 × 480", role:"Pillar",
  pipe:"Main Ø60 × 4 · End frame Ø50 × 3 · Diag Ø30 × 3 · Cross Ø30 × 3",
  w:{1:16.97, 2:28.27, 3:40.47}},
 {key:"4949-4", label:"490 × 490 (Ø60 × 4)", role:"Pillar", nd:true,
  pipe:"Main Ø60 × 4 · Diag Ø30 × 3 · End frame Ø40 × 3",
  w:{1:16.94, 2:28.03, 3:39.84}},
 {key:"4949-5", label:"490 × 490 (Ø60 × 5)", role:"Pillar", nd:true,
  pipe:"Main Ø60 × 5 · Diag Ø30 × 3 · End frame Ø40 × 3",
  w:{1:18.46, 2:31.28, 3:44.82}},
 {key:"6052-60", label:"525 × 600 (60 mm)", role:"Beam",
  pipe:"Main Ø50 × 4 (1 m) / Ø50 × 3 · Bottom Ø50 × 3 · Brace Ø30 × 3 · Sub Ø40 × 3", pipeBy:{1:"Main Ø50 × 4 · Bottom Ø50 × 3 · Brace Ø30 × 3 · Sub Ø40 × 3",
          2:"Main Ø50 × 3 · Bottom Ø50 × 2.5 · Brace Ø30 × 3 · Sub Ø40 × 3",
          3:"Main Ø50 × 3 · Bottom Ø50 × 3 · Brace Ø30 × 3 · Sub Ø30 × 3"},
  w:{1:15.65, 2:23.68, 3:40.53}},
 {key:"6052-604", label:"600 × 525 (Ø60 × 4)", role:"Beam", nd:true,
  pipe:"Main Ø60 × 4 · Bottom Ø50 × 3 · Brace Ø30 × 3 · Sub Ø30 × 3",
  w:{1:17.82, 2:31.14, 3:44.01}},   /* 60_525 X 600 frame with Ø60 × 4 chords; drawings
                                        VST_600_525_1/2/3MTR_60x4 (07/11/26), weights match parts list */
 {key:"6053-60", label:"535 × 600 (60 mm)", role:"Beam",
  pipe:"Main Ø50 × 4 (1 m) / Ø50 × 3 · Bottom Ø50 × 3 · Brace Ø30 × 3 · Sub Ø40 × 3", pipeBy:{1:"Main Ø50 × 4 · Bottom Ø50 × 3 · Brace Ø30 × 3 · Sub Ø40 × 3",
          2:"Main Ø50 × 3 · Bottom Ø50 × 2.5 · Brace Ø30 × 3 · Sub Ø40 × 3",
          3:"Main Ø50 × 3 · Bottom Ø50 × 3 · Brace Ø30 × 3 · Sub Ø30 × 3"},
  w:{1:15.73, 2:23.79, 3:40.60}},
 {key:"6053H", label:"535 × 600 Heavy", role:"Beam", nd:true,
  pipe:"Main Ø50 × 4 · Bottom Ø50 × 3 · Brace Ø30 × 3 · Sub Ø40 × 3",
  w:{1:15.73, 2:26.53, 3:44.80}},   /* 535 × 600 with Ø50×4 chords; doc estimate ≈45 kg / 3 m */
 {key:"7652-50", label:"760 × 520 (Ø50 × 3)", role:"Beam", nd:true,
  pipe:"Main Ø50 × 3 · Bottom Ø50 × 3 · Brace Ø30 × 3 · Sub Ø30 × 3",
  w:{1:15.21, 2:24.76, 3:37.87}},
 {key:"7652-60", label:"760 × 520 (Ø60 × 4)", role:"Beam", nd:true,
  pipe:"Main Ø60 × 4 · Bottom Ø50 × 3 · Brace Ø30 × 3 · Sub Ø30 × 3",
  w:{1:18.82, 2:30.99, 3:46.60}},
 {key:"8061",  label:"800 × 610", role:"Beam",
  pipe:"Main Ø60 × 4 · Bottom Ø50 × 3 · Brace Ø30 × 3 · Sub Ø30 × 3",
  pipeBy:{2:"Main Ø60 × 4 · Bottom Ø50 × 3 · Brace Ø30 × 3 · Sub Ø40 × 3"},
  w:{1:20.31, 2:31.68, 3:49.07}},
 {key:"8055",  label:"800 × 550",  role:"Beam",   pipe:"Main Ø60.00 × 4 · Diag Ø30.00 × 3 · Horiz Ø50.00 × 3",
  w:{1:19,   2:33, 3:45.5}},
 {key:"11065", label:"1100 × 650", role:"Beam",   pipe:"Main Ø63.50 × 3 · Diag Ø50.00 × 3",
  w:{1:30,   2:51, 3:70}}
];

var products = [];
/* Running feet — the standard way to quote */
PROFILES.forEach(function(f){
  products.push({sec:"feet", g:f.role + "s — by running feet",
    name:f.role + " " + f.label, code:"VST-" + f.key, unit:"ft", price:"kg",
    kg:f.w[1]*0.3048, hsn:"76109010", pipe:f.pipe, nd:!!f.nd});
});
/* Individual 1 m / 2 m / 3 m pieces, at their actual piece weight */
PROFILES.forEach(function(f){
  [3,2,1].forEach(function(m){
    products.push({sec:"pcs", g:f.role + " " + f.label,
      name:f.role + " " + f.label + " — " + m + " m", code:"VST-" + f.key + "-" + m + "M",
      unit:"pcs", price:"kg", kg:f.w[m], hsn:"76109010", pipe:(f.pipeBy && f.pipeBy[m]) || f.pipe, nd:!!f.nd});
  });
});
/* Circle truss */
products.push({sec:"circle", g:"Circle truss",
  name:"Circle Truss 20 ft dia (400 × 400)", code:"VST-CT20-4040", unit:"set", price:"kg",
  kg:265.2, hsn:"76109010",
  pipe:"8 segments · Chords Ø50.00 × 3 · Bracing Ø40.00 × 3"});
/* Round 400 × 400 modules — weight per module (Ø3 m and Ø4 m: 4 per ring; Ø5 m: 6 per ring;
   Ø20 ft inside: 8 per ring, new design) */
[["Ø3 m","RT3",  "Standard", 13.65, "Chords Ø50 × 2 · Bracing Ø25 × 3",   false, "90° arc, 4 make a ring"],
 ["Ø3 m","RT3H", "Heavy",    17.88, "Chords Ø50 × 3 · Bracing Ø30 × 3",   false, "90° arc, 4 make a ring"],
 ["Ø4 m","RT4",  "Standard", 16.70, "Chords Ø50 × 2 · Bracing Ø25 × 3",   false, "90° arc, 4 make a ring"],
 ["Ø4 m","RT4H", "Heavy",    20.96, "Chords Ø50 × 2.5 · Bracing Ø30 × 3", false, "90° arc, 4 make a ring"],
 ["Ø5 m","RT5",  "Standard", 14.88, "Chords Ø50 × 2 · Bracing Ø25 × 3",   false, "60° arc, 6 make a ring"],
 ["Ø5 m","RT5H", "Heavy",    17.93, "Chords Ø50 × 2.5 · Bracing Ø30 × 3", false, "60° arc, 6 make a ring"],
 ["Ø20 ft inside","RT20",  "Standard", 16.1, "Chords Ø50 × 2 · Bracing Ø25 × 3", true, "45° piece, 8 make a ring"],
 ["Ø20 ft inside","RT20H", "Heavy",    21.2, "Chords Ø50 × 3 · Bracing Ø30 × 3", true, "45° piece, 8 make a ring"]
].forEach(function(r){
  products.push({sec:"circle", g:"Round truss", name:"Round Truss " + r[0] + " " + r[2] + " module",
    code:"VST-" + r[1], unit:"pcs", price:"kg", kg:r[3], hsn:"76109010", pipe:r[4], nd:r[5], note:r[6]});
});

/* Sleeve blocks */
/* [name size, sheet code size, kg] — codes kept from the original sheet */
[["400","401",18],["500","501",22],["600","600",27]].forEach(function(s){
  products.push({sec:"sleeve", g:"Sleeve blocks", name:"Sleeve Block " + s[0],
    code:"VST-SB-" + s[1], unit:"pcs", price:"kg", kg:s[2], hsn:"76109090", pipe:""});
});
/* Accessories — rate per piece. Each one is either an Extra (charged, listed
   under "Extras" on the quote) or Included (shown as included, no charge). */
[["Hinge","VST-HG-01"],["Spigot 50 mm","VST-SP-50"],["Spigot 60 mm","VST-SP-60"],
 ["Bullet Pin 50 mm","VST-BuP-50"],["Bullet Pin 60 mm","VST-BuP-60"],["R Pin","VST-RP-01"],
 ["Base Plate","VST-BP-02"],["Top Plate","VST-TP-01"],["LED Clamp","VST-LC-01"],
 ["Web Sling Belt","VST-WSB-01"]].forEach(function(a){
  products.push({sec:"acc", g:"Accessories", name:a[0], code:a[1], unit:"pcs", price:"pc",
    kg:0, pc:0, mode:"extra", hsn:"76109090", pipe:""});
});

var SECTIONS = [
  {key:"feet",   title:"Pillars & Beams — running feet", open:true},
  {key:"pcs",    title:"Truss pieces — 1 m / 2 m / 3 m",  open:false},
  {key:"circle", title:"Circle & round truss",             open:false},
  {key:"sleeve", title:"Sleeve blocks",                    open:true},
  {key:"acc",    title:"Accessories — rate per piece",     open:false}
];

/* One place that decides a line's value, used by the screen and the PDF. */
function lineBase(p, rate){
  if(p.price !== "pc") return p.qty * p.kg * rate;
  return p.mode === "incl" ? 0 : p.qty * (p.pc || 0);
}
function lineKg(p){ return p.price === "pc" ? 0 : p.qty * p.kg; }

products.forEach(function(p,i){ p.id = "p"+i; p.qty = 0; });

function inr(n){
  var x = String(Math.round(Math.abs(n))), l3 = x.slice(-3), rest = x.slice(0,-3), out = "";
  if(rest){
    while(rest.length > 2){ out = "," + rest.slice(-2) + out; rest = rest.slice(0,-2); }
    return "₹" + rest + out + "," + l3;
  }
  return "₹" + l3;
}
function pipeLabel(s){
  return s.split("·").map(function(t){
    t = t.replace(/^\s*(Main|Diag|Horiz|Chords|Bracing|Bottom|Brace|Sub|End frame|Cross)\s*/i, "").replace(/\.00/g, "").replace(/\s*×\s*/g, "×").trim();
    return /^Ø/.test(t) ? t : "";
  }).filter(Boolean).join(" / ");
}
function kgFmt(n){ return (Math.round(n*10)/10).toLocaleString("en-IN") + " kg"; }
function val(id){ return parseFloat(document.getElementById(id).value) || 0; }
function txt(id){ return document.getElementById(id).value.trim(); }

/* ---- build the item rows ---- */
(function(){
  var html = "";
  SECTIONS.forEach(function(sec){
    var list = products.filter(function(p){ return p.sec === sec.key; });
    html += '<details class="sec" data-sec="' + sec.key + '"' + (sec.open ? " open" : "") + '>' +
            '<summary><span>' + sec.title + '</span><em class="cnt" id="c-' + sec.key + '"></em></summary>';
    var last = null;
    list.forEach(function(p){
      if(sec.key === "pcs" && p.g !== last){ last = p.g; html += '<div class="grouplbl">' + p.g + '</div>'; }
      html += '<div class="item' + (p.price === "pc" ? ' acc mode-' + p.mode : '') + '" id="row-' + p.id + '">' +
        '<div class="nm"><b>' + p.name + (p.nd ? ' <i class="nd">new design</i>' : '') + '</b><span>' + p.code +
          (p.pipe ? ' · ' + pipeLabel(p.pipe) : '') + (p.note ? ' · ' + p.note : '') + '</span></div>' +
        '<div class="qtybox">' +
          '<input type="number" min="0" step="1" placeholder="0" data-id="' + p.id + '" data-k="qty" inputmode="decimal">' +
          '<span class="u">' + p.unit + '</span>' +
        '</div>' +
        (p.price === "pc"
          ? '<div class="qtybox ratebox"><span class="u">₹</span>' +
            '<input type="number" min="0" step="1" placeholder="rate" data-id="' + p.id + '" data-k="pc" inputmode="decimal">' +
            '<span class="u">/pc</span></div>' +
            '<div class="modesw" role="group" aria-label="Extra or included">' +
              '<button type="button" data-id="' + p.id + '" data-mode="extra">Extra</button>' +
              '<button type="button" data-id="' + p.id + '" data-mode="incl">Included</button>' +
            '</div>'
          : '') +
        '<div class="amt off" id="a-' + p.id + '">—<small class="wt" id="w-' + p.id + '"></small></div>' +
      '</div>';
    });
    html += '</details>';
  });
  document.getElementById("items").innerHTML = html;
  document.querySelectorAll('.modesw button').forEach(function(btn){
    btn.addEventListener("click", function(){
      var p = products.find(function(x){ return x.id === btn.dataset.id; });
      p.mode = btn.dataset.mode;
      document.getElementById("row-" + p.id).className = "item acc mode-" + p.mode;
      calc();
    });
  });
  document.querySelectorAll('.qtybox input').forEach(function(el){
    el.addEventListener("input", function(e){
      var p = products.find(function(x){ return x.id === e.target.dataset.id; });
      p[e.target.dataset.k] = Math.max(0, parseFloat(e.target.value) || 0);
      calc();
    });
  });
})();

var Q = {};
function calc(){
  var rate = val("rate"), disc = val("discount"), gstP = val("gst");
  var discRate = rate * (1 - disc/100);
  var base = 0, net = 0, totW = 0;

  var counts = {};
  products.forEach(function(p){
    var w = lineKg(p), b = lineBase(p, rate), amt = b * (1 - disc/100);
    totW += w; base += b; net += amt;
    if(p.qty > 0) counts[p.sec] = (counts[p.sec] || 0) + 1;
    var el = document.getElementById("a-" + p.id);
    var incl = p.price === "pc" && p.mode === "incl";
    var needRate = p.price === "pc" && !incl && p.qty > 0 && !(p.pc > 0);
    el.firstChild.nodeValue = needRate ? "add rate" : (p.qty > 0 ? (incl ? "Included" : inr(amt)) : "—");
    el.className = "amt" + (p.qty > 0 && !needRate ? "" : " off") + (needRate ? " warn" : "") + (incl && p.qty > 0 ? " incl" : "");
    document.getElementById("w-" + p.id).textContent = (p.qty > 0 && w > 0) ? kgFmt(w) : "";
  });
  SECTIONS.forEach(function(s){
    var c = document.getElementById("c-" + s.key);
    if(c) c.textContent = counts[s.key] ? counts[s.key] + " selected" : "";
  });

  var gstAmt = net * gstP / 100, final = net + gstAmt;
  var inter = document.getElementById("supply").value === "inter";
  var half = gstAmt / 2, halfP = gstP / 2;
  Q = { base:base, net:net, gstAmt:gstAmt, final:final, disc:disc, gstP:gstP,
        inter:inter, cgst:half, sgst:half, halfP:halfP };

  document.getElementById("tWt").textContent      = kgFmt(totW);
  document.getElementById("tSub").textContent     = inr(base);
  document.getElementById("tDiscLbl").textContent = "Discount (" + disc + "%)";
  document.getElementById("tDisc").textContent    = "− " + inr(base - net);
  document.getElementById("tTax").textContent     = inr(net);
  document.getElementById("rowCg").style.display = inter ? "none" : "";
  document.getElementById("rowSg").style.display = inter ? "none" : "";
  document.getElementById("rowIg").style.display = inter ? "" : "none";
  document.getElementById("tCgLbl").textContent = "CGST @ " + halfP + "%";
  document.getElementById("tSgLbl").textContent = "SGST @ " + halfP + "%";
  document.getElementById("tIgLbl").textContent = "IGST @ " + gstP + "%";
  document.getElementById("tCg").textContent = "+ " + inr(half);
  document.getElementById("tSg").textContent = "+ " + inr(half);
  document.getElementById("tIg").textContent = "+ " + inr(gstAmt);
  document.getElementById("tFinal").textContent   = inr(final);
}
document.getElementById("wtBtn").addEventListener("click", function(){
  var on = document.body.classList.toggle("showwt");
  this.setAttribute("aria-pressed", on ? "true" : "false");
  this.textContent = on ? "Hide weight" : "Show weight";
});
["rate","discount","gst","supply","validity"].forEach(function(id){
  document.getElementById(id).addEventListener("input", calc);
});

document.getElementById("clearBtn").addEventListener("click", function(){
  products.forEach(function(p){
    p.qty = 0;
    if(p.price === "pc"){ p.pc = 0; p.mode = "extra";
      var r = document.getElementById("row-" + p.id); if(r) r.className = "item acc mode-extra"; }
  });
  document.querySelectorAll('.qtybox input').forEach(function(e){ e.value = ""; });
  ["clientName","clientPhone","clientGst","quoteNo","clientAddr"].forEach(function(id){
    document.getElementById(id).value = "";
  });
  calc();
});

calc();
</script>

/* Indian-system rupees in words, for the amount line on the quotation. */
function words(n){
  n = Math.round(n);
  if(n === 0) return "Rupees Zero Only";
  var o = ["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven",
           "Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"],
      t = ["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
  function two(x){ return x < 20 ? o[x] : t[Math.floor(x/10)] + (x%10 ? " " + o[x%10] : ""); }
  function three(x){
    return (x > 99 ? o[Math.floor(x/100)] + " Hundred" + (x%100 ? " " : "") : "") + two(x%100);
  }
  var out = "", cr = Math.floor(n/10000000); n %= 10000000;
  var la = Math.floor(n/100000);  n %= 100000;
  var th = Math.floor(n/1000);    n %= 1000;
  if(cr) out += three(cr) + " Crore ";
  if(la) out += three(la) + " Lakh ";
  if(th) out += three(th) + " Thousand ";
  if(n)  out += three(n);
  return "Rupees " + out.trim().replace(/\s+/g," ") + " Only";
}

/* Wrap a spec sub-line to the column, at the small size it is drawn at. */
function subLines(doc, s, w, size){
  var prev = doc.getFontSize();
  doc.setFontSize(size || 7.4);
  var out = doc.splitTextToSize(s, Math.max(20, w));
  doc.setFontSize(prev);
  return out.slice(0, 2);
}

/* "Main Ø50.00 × 3 · Diag Ø40.00 × 3" -> "Ø50×3 / Ø40×3" for busy quotes. */
function shortPipe(s){
  if(!s) return "";
  return s.split("·").map(function(t){
    t = t.replace(/^\s*(Main|Diag|Horiz|Chords|Bracing|Bottom|Brace|Sub|End frame|Cross)\s*/i, "").replace(/\.00/g, "")
         .replace(/\s*×\s*/g, "×").trim();
    return /^Ø/.test(t) ? t : "";
  }).filter(Boolean).join(" / ");
}

/* Full pipe wording on short quotes, compact wording on long ones. */
var FIT = null;
function subText(r){
  if(!r) return "";
  if(FIT && FIT.spec && r.full) return r.full;
  return r.compact || r.sub || "";
}

function makePDF(){
  var Ctor = (window.jspdf && window.jspdf.jsPDF) || window.jsPDF;
  var doc = new Ctor({ unit:"mm", format:"a4" });
  var F = "VST";
  doc.addFileToVFS("v.ttf", window.__F_REG);  doc.addFont("v.ttf", F, "normal");
  doc.addFileToVFS("vb.ttf", window.__F_BOLD); doc.addFont("vb.ttf", F, "bold");

  var NAVY=[27,79,140], INK=[19,37,62], MUT=[85,112,143], RED=[176,58,46],
      LINE=[207,224,242], HEAD=[228,238,251];
  var PW = doc.internal.pageSize.getWidth(), ML = 15, y = 8;

  var rows = [], n = 0;
  function addLine(p){
    n++;
    var incl = p.price === "pc" && p.mode === "incl";
    var amt = lineBase(p, val("rate")) * (1 - val("discount")/100);
    rows.push({ sn:String(n), name:p.name,
                sub:p.code + "   ·   HSN " + p.hsn, pipe:p.pipe, pipeShort:shortPipe(p.pipe),
                qty:(Math.round(p.qty*100)/100) + " " + p.unit, amt: incl ? "Included" : inr(amt),
                incl:incl });
  }
  var picked = products.filter(function(p){ return p.qty > 0; });
  var mainL  = picked.filter(function(p){ return p.price !== "pc"; });
  var extraL = picked.filter(function(p){ return p.price === "pc" && p.mode !== "incl"; });
  var inclL  = picked.filter(function(p){ return p.price === "pc" && p.mode === "incl"; });
  mainL.forEach(addLine);
  if(extraL.length){ rows.push({ hdr:true, name:"Extras" }); extraL.forEach(addLine); }
  if(inclL.length){ rows.push({ hdr:true, name:"Included accessories (no extra charge)" }); inclL.forEach(addLine); }
  if(!n) rows.push({ sn:"", name:"No items selected.", sub:"", qty:"", amt:"" });

  /* Everything must land on one page, so the letterhead and table tighten
     as the number of quoted lines grows. */
  FIT = null;
  rows.forEach(function(r){
    if(r.pipe){ r.full = r.sub + "   ·   " + r.pipe; r.compact = r.sub + "  ·  " + r.pipeShort; }
  });
  var N = rows.length;
  var fit = N <= 3  ? { logo:76, pad:2.3, name:10,  sub:7.4, rowGap:9.2, spec:true  }
          : N <= 6  ? { logo:58, pad:1.5, name:9.0, sub:6.8, rowGap:7.9, spec:false }
          : N <= 9  ? { logo:44, pad:0.9, name:8.2, sub:6.2, rowGap:6.6, spec:false }
          :           { logo:30, pad:0.45, name:7.6, sub:5.8, rowGap:5.8, spec:false };
  FIT = fit;

  /* letterhead: badge + wordmark, centred as one lockup */

      wImg = document.getElementById("brandWord");
  var wW = fit.logo, wH = wW * (wImg.naturalHeight || 523) / (wImg.naturalWidth || 1000);
  var bH = wH, bW = bH * (bImg.naturalWidth || 460) / (bImg.naturalHeight || 594);
  var gap = 7, lockW = bW + gap + wW, lx = (PW - lockW) / 2;
  try{ doc.addImage(bImg.src, "JPEG", lx, y, bW, bH); }catch(e){}
  try{ doc.addImage(wImg.src, "JPEG", lx + bW + gap, y, wW, wH); }catch(e){}
  y += wH + 6;
  doc.setFont(F,"normal"); doc.setFontSize(8.8); doc.setTextColor(INK[0],INK[1],INK[2]);
  doc.text(FIRM.addr, PW/2, y, {align:"center"}); y += 4.6;
  doc.setFontSize(8.4); doc.setTextColor(MUT[0],MUT[1],MUT[2]);
  doc.text("GSTIN: " + FIRM.gstin + "     " + FIRM.phone + "     " + FIRM.email,
           PW/2, y, {align:"center"});
  y += 4.5;
  doc.setDrawColor(NAVY[0],NAVY[1],NAVY[2]); doc.setLineWidth(.7);
  doc.line(ML, y, PW-ML, y); y += 7;

  doc.setFont(F,"bold"); doc.setFontSize(19); doc.setTextColor(INK[0],INK[1],INK[2]);
  doc.text("Q U O T A T I O N", PW/2, y, {align:"center"}); y += 8.5;

  var d = new Date();
  var meta = [["Client Name", txt("clientName") || "—"]];
  if(txt("clientAddr"))  meta.push(["Address", txt("clientAddr")]);
  if(txt("clientGst"))   meta.push(["Client GST No.", txt("clientGst")]);
  if(txt("clientPhone")) meta.push(["Mobile", txt("clientPhone")]);
  if(txt("quoteNo"))     meta.push(["Quotation No.", txt("quoteNo")]);
  meta.push(["Date", d.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"})]);

  /* two columns keeps the client block short so the banner can be large */
  doc.setFontSize(9.6);
  var colX = [ML, ML + (PW - 2*ML) / 2];
  var half = Math.ceil(meta.length / 2);
  var cy = y, maxY = y;
  meta.forEach(function(r, i){
    var col = i < half ? 0 : 1;

    doc.text(r[0], colX[col], cy);
    doc.setFont(F,"normal"); doc.setTextColor(43,74,110);
    doc.text(String(r[1]), colX[col] + 32, cy);

  table(doc, {

      return [r.sn, r.name, r.qty, r.amt];
    }),
    theme:"grid",
    styles:{font:F,fontSize:fit.name,cellPadding:{top:fit.pad,bottom:fit.pad,left:3,right:3},
            lineColor:LINE,lineWidth:.2,textColor:INK,valign:"top"},
    headStyles:{font:F,fontStyle:"bold",fillColor:HEAD,textColor:INK,fontSize:8.5,
                lineColor:[183,211,238]},
    columnStyles:{0:{cellWidth:18,halign:"center",textColor:MUT},
                  1:{cellWidth:"auto"},
                  2:{cellWidth:24,halign:"center"},
                  3:{cellWidth:34,halign:"right",fontStyle:"bold"}},
    didParseCell:function(dt){
      if(dt.section==="head"){
        if(dt.column.index===0||dt.column.index===2) dt.cell.styles.halign="center";
        if(dt.column.index===3) dt.cell.styles.halign="right";
      }
      if(dt.section==="body" && dt.column.index===1 && rows[dt.row.index] && subText(rows[dt.row.index])){
        var wpx = dt.cell.styles.cellWidth;
        dt.cell.styles.minCellHeight = fit.rowGap - 1 + fit.sub * 0.42 * subLines(doc, subText(rows[dt.row.index]),
          (typeof wpx === "number" ? wpx : 96) - 6, fit.sub).length;
      }
    },
    willDrawCell:function(dt){
      if(dt.section==="body" && dt.column.index===1) doc.setFont(F,"bold");
      var r = rows[dt.row.index];
      if(dt.section==="body" && dt.column.index===3 && r && r.incl){
        doc.setFont(F,"normal"); doc.setTextColor(46,125,79);
      }
    },
    didDrawCell:function(dt){
      if(dt.section!=="body" || dt.column.index!==1) return;
      var r = rows[dt.row.index]; if(!r || !subText(r)) return;
      doc.setFont(F,"normal"); doc.setFontSize(fit.sub); doc.setTextColor(MUT[0],MUT[1],MUT[2]);
      doc.text(subLines(doc, subText(r), dt.cell.width - 6, fit.sub), dt.cell.x+3, dt.cell.y+fit.rowGap);
      doc.setFontSize(fit.name); doc.setTextColor(INK[0],INK[1],INK[2]);
    }
  });

  y = ((doc.lastAutoTable && doc.lastAutoTable.finalY) || y+30) + 7;

  var lines = [["Sub Total", inr(Q.base), "n"]];
  if(Q.base - Q.net > .5) lines.push(["Discount ("+Q.disc+"%)", "− "+inr(Q.base-Q.net), "d"]);
  lines.push(["Taxable Value", inr(Q.net), "n"]);
  if(Q.gstAmt > .5){
    if(Q.inter){
      lines.push(["IGST @ "+Q.gstP+"%", "+ "+inr(Q.gstAmt), "n"]);
    } else {
      lines.push(["CGST @ "+Q.halfP+"%", "+ "+inr(Q.cgst), "n"]);
      lines.push(["SGST @ "+Q.halfP+"%", "+ "+inr(Q.sgst), "n"]);
    }
  }
  lines.push(["Final Price", inr(Q.final), "g"]);

  var tw = 92, tx = PW-ML-tw, lw2 = 52, rh = 7.8;
  doc.setLineWidth(.2);
  lines.forEach(function(r){
    var g = r[2]==="g";
    if(g){ doc.setFillColor(NAVY[0],NAVY[1],NAVY[2]); doc.rect(tx,y,tw,rh+1.5,"F"); }
    else { doc.setDrawColor(LINE[0],LINE[1],LINE[2]);
           doc.rect(tx,y,lw2,rh); doc.rect(tx+lw2,y,tw-lw2,rh); }
    var lc = g?[255,255,255]:(r[2]==="d"?RED:[54,87,127]);
    var vc = g?[255,255,255]:(r[2]==="d"?RED:INK);
    doc.setFont(F,"bold"); doc.setFontSize(g?12:10);
    doc.setTextColor(lc[0],lc[1],lc[2]); doc.text(r[0], tx+4, y+(g?7.2:6.1));
    doc.setTextColor(vc[0],vc[1],vc[2]);
    doc.text(r[1], tx+tw-4, y+(g?7.2:6.1), {align:"right"});
    y += g ? rh+1.5 : rh;
  });

  /* ---------- amount in words ---------- */
  y += 5;
  var PH = doc.internal.pageSize.getHeight();
  function room(need){
    if(y + need > PH - 14){ doc.addPage(); y = 16; }
  }
  room(14);
  doc.setDrawColor(LINE[0],LINE[1],LINE[2]); doc.setLineWidth(.2);
  doc.setFillColor(244,249,254); doc.rect(ML, y, PW-2*ML, 9, "FD");
  doc.setFont(F,"bold"); doc.setFontSize(9); doc.setTextColor(INK[0],INK[1],INK[2]);
  doc.text("Amount in words:", ML+3, y+6);
  doc.setFont(F,"normal");
  doc.text(words(Q.final), ML+38, y+6);
  y += 15;

  /* ---------- bank + terms, side by side ---------- */
  room(30);
  var colW = (PW - 2*ML - 6) / 2, bx = ML, tx2 = ML + colW + 6, top = y;

  doc.setFont(F,"bold"); doc.setFontSize(8.6); doc.setTextColor(NAVY[0],NAVY[1],NAVY[2]);
  doc.text("BANK DETAILS", bx, y);
  doc.text("TERMS", tx2, y);
  y += 5;

  doc.setFontSize(8.6); doc.setTextColor(INK[0],INK[1],INK[2]);
  var bank = [["Account Name", FIRM.accNm], ["Bank", FIRM.bank],
              ["A/c No.", FIRM.acc], ["IFSC", FIRM.ifsc]];
  var by = y;
  bank.forEach(function(r){
    doc.setFont(F,"normal"); doc.setTextColor(MUT[0],MUT[1],MUT[2]);
    doc.text(r[0], bx, by);
    doc.setFont(F,"bold"); doc.setTextColor(INK[0],INK[1],INK[2]);
    doc.text(r[1], bx + 26, by);
    by += 4.2;
  });

  var vd = parseFloat(document.getElementById("validity").value) || 7;
  var terms = ["Payment: 30% advance, 40% in 15 days, 30% on dispatch.",
               "Quotation valid for " + vd + " days from the date above.",
               "Prices are subject to confirmation at the time of order.",
               "GST as applicable is shown above and charged extra.",
               "This is a quotation and not a tax invoice."];
  var ty = y;
  doc.setFont(F,"normal"); doc.setFontSize(7.8); doc.setTextColor(MUT[0],MUT[1],MUT[2]);
  terms.forEach(function(t){
    var wrapped = doc.splitTextToSize("\u2022  " + t, colW);
    doc.text(wrapped, tx2, ty);
    ty += wrapped.length * 3.7;
  });

  y = Math.max(by, ty) + 3;

  /* ---------- signature + company stamp ---------- */
  /* exactly the block height (seal + gaps + caption); 11 mm bottom margin here */
  if(y + (N > 11 ? 22 : N > 9 ? 24 : 29) > PH - 11){ doc.addPage(); y = 16; }
  doc.setFont(F,"bold"); doc.setFontSize(9); doc.setTextColor(INK[0],INK[1],INK[2]);
  doc.text("For " + FIRM.name, PW-ML, y, {align:"right"});
  var lineL = PW-ML-52, top = y;
  /* stamp sits to the left of the signature line, square-on */
  var busy = N > 9;                       /* long quotes: compact block keeps one page */
  /* seal sits between "For …" and "Authorised Signatory", centred over the line */
  var stD = N > 11 ? 15 : busy ? 17 : 22;
  try{ doc.addImage(window.__STAMP, "PNG", lineL + (52 - stD)/2, top + 1.5, stD, stD); }catch(e){}
  y = top + 1.5 + stD + 1;
  doc.setDrawColor(LINE[0],LINE[1],LINE[2]); doc.setLineWidth(.3);
  doc.line(lineL, y, PW-ML, y);
  doc.setFont(F,"normal"); doc.setFontSize(8.2); doc.setTextColor(MUT[0],MUT[1],MUT[2]);
  doc.text("Authorised Signatory", PW-ML, y+4.5, {align:"right"});

  var who = (txt("clientName")||"Quotation").replace(/[^\w\s-]/g,"").trim().replace(/\s+/g,"_");
  var qn  = txt("quoteNo").replace(/[^\w-]/g,"_");
  savePDF(doc, "Quotation_" + who + (qn ? "_"+qn : "") + ".pdf");
}

/* Inside a published page the browser's own download is inert, so use the
   downloads capability when present; fall back to jsPDF when opened directly. */
function savePDF(doc, filename){
  var blob;
  try{ blob = doc.output("blob"); }catch(e){ doc.save(filename); return; }
  var get = null;
  try{ get = (window.claude && typeof claude.use === "function") ? claude.use("downloads") : null; }
  catch(e){ get = null; }
  if(!get || typeof get.then !== "function"){ doc.save(filename); return; }
  get.then(function(dl){
    if(!dl){ doc.save(filename); return; }
    return dl.save({ filename: filename, data: blob }).catch(function(err){
      var code = err && err.code;
      if(code === "declined" || code === "rate_limited") return;
      alert("Could not save the PDF" + (err && err.message ? ": " + err.message : "."));
    });
  }).catch(function(){ doc.save(filename); });
}

/* AutoTable ships as a plugin (v3) or a plain function (v5). */
function table(doc, opts){
  if(typeof doc.autoTable === "function") return doc.autoTable(opts);
  var ap = window.applyPlugin || (window.jspdf && window.jspdf.applyPlugin);
  if(typeof ap === "function"){
    ap((window.jspdf && window.jspdf.jsPDF) || window.jsPDF);
    if(typeof doc.autoTable === "function") return doc.autoTable(opts);
  }
  var fn = window.autoTable || (window.jspdf && window.jspdf.autoTable);
  if(typeof fn === "function") return fn(doc, opts);
  throw new Error("table plugin unavailable");
}
